<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sign Language Translator</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for Translation History -->
        <aside class="history-sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> History</h2>
                <button id="clear-history-btn" title="Clear History"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div class="history-list" id="history-list">
                <!-- History items will be dynamically inserted here -->
                <div class="empty-state">No translations yet. Start signing!</div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="app-header">
                <h1>AI Real-Time <span>Gesture Translator</span></h1>
                <p>Powered by Google MediaPipe Vision</p>
            </header>

            <div class="translator-workspace">
                <!-- Camera and Canvas Feed -->
                <div class="video-container glass-card">
                    <div class="status-badge" id="camera-status">
                        <i class="fa-solid fa-video-slash"></i> Camera Off
                    </div>
                    <!-- Hidden video element to capture feed -->
                    <video id="webcam" autoplay playsinline></video>
                    <!-- Visible canvas where video and AI skeleton are drawn -->
                    <canvas id="output_canvas"></canvas>
                    
                    <button id="enableWebcamButton" class="primary-btn">
                        <i class="fa-solid fa-camera"></i> Enable Camera
                    </button>
                </div>

                <!-- Live Translation Results -->
                <div class="translation-result glass-card">
                    <h3>Live Translation</h3>
                    <div class="recognized-gesture">
                        <span id="gesture-emoji">👋</span>
                        <span id="gesture-output">Waiting for gesture...</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidence-fill" style="width: 0%"></div>
                    </div>
                    <p class="confidence-text">Confidence: <span id="confidence-value">0</span>%</p>
                </div>
            </div>
        </main>
    </div>

    <!-- MediaPipe Modules for Gesture Recognition -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
