<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HearHelper</title>
    <link rel="stylesheet" href="../css/forgot-password.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-wrapper">
            <!-- Left Side -->
            <div class="auth-brand">
                <h1>🎤 HearHelper</h1>
                <p>Password Recovery</p>
                <div class="brand-features">
                    <div class="feature">
                        <span>🔒</span>
                        <p>Secure reset process</p>
                    </div>
                    <div class="feature">
                        <span>📧</span>
                        <p>Email verification</p>
                    </div>
                    <div class="feature">
                        <span>✅</span>
                        <p>Quick recovery</p>
                    </div>
                </div>
            </div>

            <!-- Right Side -->
            <div class="auth-form-container">
                <div class="form-header">
                    <h2>Reset Password</h2>
                    <p>Enter your email to receive reset link</p>
                </div>

                <div id="alertContainer"></div>

                <!-- Step 1: Email Verification -->
                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <input type="email" id="resetEmail" name="email" placeholder="Enter your registered email"
                            required>
                    </div>

                    <button type="submit" class="btn-login">
                        Send Reset Link
                    </button>

                    <p style="text-align: center; margin-top: 1rem;">
                        <a href="login.html" style="color: #3498db; text-decoration: none;">
                            ← Back to Login
                        </a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/forgot-password.js"></script>
</body>

</html>
