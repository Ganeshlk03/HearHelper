<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HearHelper</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">🎤 HearHelper</div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="login.html" class="nav-link active">Login Panel</a></li>
                <li><a href="#" class="nav-link" onclick="logoutAdmin()">Logout</a></li>
            </ul>
        </div>
    </nav>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome!</h1>
                <p>Sign in to your account</p>
            </div>

            <div class="role-toggle-container" id="roleToggle">
                <div class="role-slider"></div>
                <div class="role-option active" id="userOpt">User</div>
                <div class="role-option" id="adminOpt">Admin</div>
            </div>

            <div id="alertContainer"></div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" id="emailLabel">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group password-container">
                    <label for="password">Password</label>
                    <div class="password-group">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-options"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; cursor: pointer; color: #7f8c8d;">
                        <input type="checkbox" id="rememberMe" style="margin-right: 8px;">
                        Remember me
                    </label>
                    <a href="./forgot-password.html" style="color: #3498db; text-decoration: none; font-weight: 600;">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" id="submitBtn" class="btn-login">Sign In</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account?
                    <a href="./register.html" class="register-link">Create one here</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="../js/login.js"></script>
</body>

</html>
